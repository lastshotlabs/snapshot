name: Publish to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout snapshot
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Use npm 11
        run: npm install -g npm@^11.10.0

      # Must precede `npm ci`: snapshot now depends on
      # @lastshotlabs/frontend-contract from GitHub Packages, so installing
      # needs auth too — not just publishing. This only maps the @lastshotlabs
      # scope; the default registry stays npmjs.org, so public deps and the
      # install smoke test in release:check are unaffected.
      - name: Configure npm for GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > $HOME/.npmrc
          echo "@lastshotlabs:registry=https://npm.pkg.github.com" >> $HOME/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install snapshot dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: github.event_name == 'release'
        run: |
          node -e 'const pkg = require("./package.json"); const expected = "v" + pkg.version; const actual = process.env.GITHUB_REF_NAME; if (actual !== expected) { console.error("Tag " + actual + " does not match package version " + expected); process.exit(1); }'

      - name: Check snapshot release
        run: npm run release:check

      - name: Publish snapshot to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

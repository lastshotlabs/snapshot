name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-legacy-peer-deps

      - name: Check formatting
        run: npm run format:check

      - name: Check component-test ratchet
        run: npm run components:test-coverage
        env:
          COMPONENT_TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Check generated component exports
        run: npm run components:exports:check

      - name: Check release publishing controls
        run: npm run release:config:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  installed-consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-legacy-peer-deps

      - name: Build packed artifacts
        run: npm run build

      - name: Check component size budgets
        run: npm run components:size-check

      - name: Verify clean installed consumers
        run: npm run install:smoke
